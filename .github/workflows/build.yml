name: Build Docker-enabled Kernel for Poco X3 Pro (vayu)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Compile LineageOS 22.2 Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libssl-dev libelf-dev binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Clone Proton Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone LineageOS sm8150 Kernel (branch lineage-22.2)
        run: |
          git clone --depth=1 -b lineage-22.2 https://github.com/LineageOS/android_kernel_xiaomi_sm8150.git kernel

      - name: Inject Docker & Container configs
        run: |
          echo "" >> kernel/arch/arm64/configs/vendor/xiaomi/vayu.config
          echo "# --- DOCKER CONTAINER SUPPORT FLAGS ---" >> kernel/arch/arm64/configs/vendor/xiaomi/vayu.config
          cat docker.config >> kernel/arch/arm64/configs/vendor/xiaomi/vayu.config
          echo "Merged Docker config into vayu.config:"
          tail -n 35 kernel/arch/arm64/configs/vendor/xiaomi/vayu.config

      - name: Compile Kernel Image and DTBO
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out KCFLAGS="-w" vendor/sm8150-perf_defconfig vendor/xiaomi/sm8150-common.config vendor/xiaomi/vayu.config
          make -j$(nproc --all) O=out KCFLAGS="-w" Image.gz-dtb dtbo.img

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/device.name1=.*/device.name1=vayu/' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=bhima/' anykernel/anykernel.sh
          sed -i 's/is_slot_device=1/is_slot_device=0/' anykernel/anykernel.sh
          sed -i 's|block=/dev/block/bootdevice/by-name/boot|block=/dev/block/by-name/boot|' anykernel/anykernel.sh

          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img anykernel/
          fi

          cd anykernel
          zip -r9 ../AnyKernel3-vayu-LineageOS22.2-Docker.zip * -x .git README.md *placeholder
          ls -lh ../AnyKernel3-vayu-LineageOS22.2-Docker.zip

      - name: Upload Kernel Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-vayu-LineageOS22.2-Docker
          path: AnyKernel3-vayu-LineageOS22.2-Docker.zip
          retention-days: 7
