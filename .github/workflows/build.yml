name: Build CreeviexOs Server Kernel for Poco X3 Pro (vayu)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Compile Patched CreeviexOs Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev \
            python3 zip unzip wget kmod cpio device-tree-compiler \
            ccache lld llvm clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libxml2-utils

      - name: Clone CreeviexOs Kernel Source
        run: |
          git clone --depth=1 https://github.com/creeviexos/CreeviexOs-Kernel-vayu.git kernel

      - name: Inject Docker & Server Configs
        run: |
          echo "" >> kernel/arch/arm64/configs/vayu_defconfig
          echo "# --- DOCKER & SERVER OPTIMIZATIONS ---" >> kernel/arch/arm64/configs/vayu_defconfig
          cat docker.config >> kernel/arch/arm64/configs/vayu_defconfig
          echo "Merged Docker & Server config into vayu_defconfig:"
          tail -n 45 kernel/arch/arm64/configs/vayu_defconfig

      - name: Compile CreeviexOs Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=Tiagolinex
          export KBUILD_BUILD_HOST=github-ci

          echo "Configuring kernel with vayu_defconfig..."
          make O=out ARCH=arm64 vayu_defconfig

          echo "Compiling Kernel Image..."
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb 2>&1 | tee build.log || \
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz 2>&1 | tee -a build.log

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel
          sed -i 's/kernel.string=.*/kernel.string=CreeviexOs Kernel (Docker & Server Mod) for Poco X3 Pro/' anykernel/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=vayu/' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=bhima/' anykernel/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=M2102J20SG/' anykernel/anykernel.sh
          sed -i 's/device.name4=.*/device.name4=M2102J20SI/' anykernel/anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/by-name/boot;|' anykernel/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/' anykernel/anykernel.sh

          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz anykernel/Image.gz
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image anykernel/Image
          fi

          find kernel/out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} anykernel/ \; 2>/dev/null || true
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img anykernel/
          fi

          cd anykernel
          zip -r9 ../AnyKernel3-CreeviexOs-Server-vayu.zip * -x .git README.md *placeholder
          ls -lh ../AnyKernel3-CreeviexOs-Server-vayu.zip

      - name: Upload Kernel Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-CreeviexOs-Server-vayu
          path: AnyKernel3-CreeviexOs-Server-vayu.zip
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
