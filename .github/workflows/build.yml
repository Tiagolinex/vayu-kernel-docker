name: Build Docker-enabled Kernel for Poco X3 Pro (vayu)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Compile LineageOS 22.2 Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex \
            git libssl-dev libelf-dev zip libxml2-utils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            python3 python-is-python3 cpio

      - name: Clone Proton Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$GITHUB_WORKSPACE/clang"

      - name: Clone LineageOS sm8150 Kernel (branch lineage-22.2)
        run: |
          git clone --depth=1 -b lineage-22.2 https://github.com/LineageOS/android_kernel_xiaomi_sm8150.git kernel

      - name: Inject Docker & Container configs
        run: |
          echo "" >> kernel/arch/arm64/configs/vendor/xiaomi/vayu.config
          echo "# --- DOCKER CONTAINER SUPPORT FLAGS ---" >> kernel/arch/arm64/configs/vendor/xiaomi/vayu.config
          cat docker.config >> kernel/arch/arm64/configs/vendor/xiaomi/vayu.config
          echo "Merged Docker config into vayu.config:"
          tail -n 35 kernel/arch/arm64/configs/vendor/xiaomi/vayu.config

      - name: Compile Kernel Image and DTBs
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          MAKE_ARGS="O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS=-w"

          echo "Configuring kernel with defconfig..."
          make $MAKE_ARGS vendor/sm8150-perf_defconfig vendor/xiaomi/sm8150-common.config vendor/xiaomi/vayu.config

          echo "Compiling Image.gz-dtb..."
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/kernel.string=.*/kernel.string=LineageOS 22.2 Docker Kernel for Poco X3 Pro/' anykernel/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=vayu/' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=bhima/' anykernel/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=M2102J20SG/' anykernel/anykernel.sh
          sed -i 's/device.name4=.*/device.name4=M2102J20SI/' anykernel/anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=auto;|' anykernel/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/' anykernel/anykernel.sh

          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz anykernel/Image.gz
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image anykernel/Image
          fi

          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img anykernel/
          fi

          cd anykernel
          zip -r9 ../AnyKernel3-vayu-LineageOS22.2-Docker.zip * -x .git README.md *placeholder
          ls -lh ../AnyKernel3-vayu-LineageOS22.2-Docker.zip

      - name: Upload Kernel Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-vayu-LineageOS22.2-Docker
          path: AnyKernel3-vayu-LineageOS22.2-Docker.zip
          retention-days: 7
